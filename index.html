<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PataHood</title>
    <script src="https://kit.fontawesome.com/d9b40b5c2f.js" crossorigin="anonymous"></script>
    <script src="./src/scripts/api.js" defer></script>
    <script src="./src/scripts/dados-profissionais.js" defer></script>
    <script src="./src/scripts/index.js" defer></script>
</head>
<body>
    <header class="header">
        <nav class="header__nav">
            <a class="header__logo" href="#"><img src="" alt="Logo PataHood"></a>
            <a class="header__link" href="#">Mural de avisos</a>
            <a class="header__link" href="#">Seja um cuidador</a>
        </nav>

        <a class="header__botao-login" href="#">Entrar</a>
    </header>

    <section class="hero">
        <img class="hero__banner" src="" alt="Ilustração PataHood">
        <p class="hero__descricao">Encontre cuidadores qualificados perto de você</p>
    </section>

    <main>
        <section class="campos">
            <div class="busca">
                <i class="busca__icone-lupa fa-solid fa-magnifying-glass"></i>
                <input class="busca__input" type="text" name="" id="busca-input" placeholder="Buscar...">
            </div>

            <div class="acoes">
                <button class="botao botao--cuidadores" id="botao-cuidadores" type="button">Encontrar Cuidador</button>
                <button class="botao botao--pets" id="botao-pets" type="button">Acompanhar pet</button>
            </div>
        </section>

        <section class="lista-elementos" id="lista-cards"></section>
    </main>

    <footer></footer>
</body>
</html>

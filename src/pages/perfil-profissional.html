<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PataHood - Perfil Profissional</title>
    <script src="https://kit.fontawesome.com/d9b40b5c2f.js" crossorigin="anonymous"></script>
    <script src="../scripts/api.js" defer></script>
    <script src="../scripts/perfil-profissional.js" defer></script>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/perfil-profissional.css">
    <link rel="stylesheet" href="../styles/solicitacao.css">
</head>
<body>
    <header class="header">
        <nav class="header__nav">
            <a class="header__logo" href="../../index.html"><img src="../../assets/logo-patahood.png" alt="Logo PataHood"></a>
            <a class="header__link" href="#">Mural de avisos</a>
            <a class="header__link" href="#">Seja um cuidador</a>
        </nav>

        <a class="header__botao-login" href="#">Entrar</a>
    </header>

    <main class="perfil">
        <div class="perfil__fundo-superior"></div>

        <section class="perfil__apresentacao">
            <img class="perfil__foto" id="perfil-foto" src="" alt="Foto de perfil">

            <div class="perfil__info">
                <h1 class="perfil__nome" id="perfil-nome">Carregando Perfil...</h1>
                <ul class="perfil__certificacoes" id="perfil-certificacoes"></ul>
            </div>

            <button class="contratar-botao" id="botao-contratar" type="button">
                Contratar <span id="perfil-preco">R$ --,--/h</span>
            </button>
        </section>

        <section class="ficha-info">
            <div class="ficha-info__item ficha-info__item--descricao" id="perfil-descricao">Carregando Perfil...</div>
            <div class="ficha-info__item" id="perfil-idade">Carregando Perfil...</div>
            <div class="ficha-info__item" id="perfil-especies">Carregando Perfil...</div>
            <div class="ficha-info__item" id="perfil-dias">Carregando Perfil...</div>
            <div class="ficha-info__item" id="perfil-horarios">Carregando Perfil...</div>
            
            <div class="ficha-info__item ficha-info__item--reputacao">
                <div class="ficha-info__item--pontuacao">
                    <i class="estrela-icone fa-solid fa-star"></i>
                    <p id="perfil-nota">-.-</p>
                </div>

                <div class="ficha-info__item--experiencia">
                    <i class="mala-icone fa-solid fa-suitcase"></i>
                    <p id="perfil-experiencia">- anos</p>
                </div>
            </div>
        </section>

        <section class="avaliacoes">
            <h2 class="avaliacoes__titulo">Avaliações</h2>
            <ul class="avaliacoes__lista" id="avaliacoes-lista"></ul>
        </section>
    </main>

    <form class="solicitacao escondida" id="form-solicitacao">
        <section class="solicitacao__cabecalho">
            <h2 class="solicitacao__titulo">Finalize sua solicitação</h2>
            <button class="botao-fechar" id="botao-fechar-janela" type="button" aria-label="Fechar janela">
                <i class="fechar-icone fa-solid fa-xmark"></i>
            </button>
        </section>

        <fieldset class="selecionar-pet">
            <legend class="selecionar-pet__titulo">Selecionar pets</legend>
            <ul class="lista-pets" id="lista-pets-solicitacao"></ul>
        </fieldset>

        <section class="solicitacao__datas">
            <label for="dia-inicio">Data de início</label>
            <input class="solicitacao__dia" type="date" name="dataInicio" id="dia-inicio" required>

            <label for="dia-fim">Data de término</label>
            <input class="solicitacao__dia" type="date" name="dataFim" id="dia-fim" required>
        </section>

        <section class="solicitacao__horarios">
            <label for="hora-inicio">Horário de início</label>
            <input class="solicitacao__hora" type="time" name="horaInicio" id="hora-inicio" required>
            
            <label for="hora-fim">Horário de término</label>
            <input class="solicitacao__hora" type="time" name="horaFim" id="hora-fim" required>
        </section>
    
        <label for="info-adicionais">Informações adicionais:</label>
        <input class="info-adicionais" type="text" name="infoAdicionais" id="info-adicionais">

        <button class="solicitacao__botao" type="submit">Solicitar Serviço</button>
    </form>

    <footer></footer>
</body>
</html>
